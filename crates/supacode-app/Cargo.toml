[package]
name = "supacode-app"
description = "SupaCode : l'IDE natif pour coder avec l'IA."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "supacode"
path = "src/main.rs"

[dependencies]
supacode-core.workspace = true
anyhow.workspace = true
gpui-kit = "0.8.1"
alacritty_terminal = "0.26"
async-channel = "2"
notify = "8"
similar = "2"
dirs = "6"
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
globset = "0.4.20"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57"
